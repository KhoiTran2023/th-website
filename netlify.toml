# Netlify builds this site straight from GitHub.
# Every push to main deploys to texashumanoids.org; every pull request gets a preview URL.
[build]
  publish = "."
  # Plain static site: nothing to build.
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images rarely change, so let browsers cache them for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
